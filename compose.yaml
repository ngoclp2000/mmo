name: commerceos
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: commerceos
      MYSQL_USER: commerce
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?copy .env.example to .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -ucommerce -Dcommerceos -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    image: commerceos-backend:local
    build: {context: ., dockerfile: infra/Dockerfile}
    environment: &backend-env
      APP_MODE: demo
      NODE_ENV: development
      APP_ORIGIN: http://localhost:8080
      DATABASE_URL: mysql://commerce:${MYSQL_PASSWORD}@mysql:3306/commerceos
      REDIS_URL: redis://redis:6379
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set a local demo password}
    command: ["sh", "-c", "node dist/packages/core/src/migrate.js && node dist/packages/core/src/seed.js"]
    depends_on:
      mysql: {condition: service_healthy}
  api:
    image: commerceos-backend:local
    environment: *backend-env
    command: ["node", "dist/apps/api/src/server.js"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
  worker:
    image: commerceos-backend:local
    environment: *backend-env
    command: ["node", "dist/apps/worker/src/main.js"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(Date.now()-Number(require('fs').readFileSync('/tmp/commerceos-worker-heartbeat','utf8'))<15000?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    image: commerceos-web:local
    build: {context: ., dockerfile: infra/web.Dockerfile}
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  mysql-data:
  redis-data:
